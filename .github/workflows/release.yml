name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://wrwjhzfplumszonhxbgr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_dy7CIylC5iIvLqlz0jzmJA_8nvJzv4E' }}
        run: pnpm build

      - name: Package dist
        run: |
          cd dist && zip -r ../low-code-platform-dist.zip . && cd ..
          ls -lh low-code-platform-dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: low-code-platform-dist.zip
          generate_release_notes: true
